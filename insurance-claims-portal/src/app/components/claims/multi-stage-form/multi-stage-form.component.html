<div class="multi-stage-container">
  <h2>Insurance Claim Form</h2>

  <ng-container [ngSwitch]="stage">
    <app-primary-details
      *ngSwitchCase="1"
      [data]="primaryData"
      (next)="handleNext($event)">
    </app-primary-details>

    <app-documents
      *ngSwitchCase="2"
      [data]="documentsData"
      (next)="handleNext($event)"
      (back)="handleBack()">
    </app-documents>
  </ng-container>
</div>
