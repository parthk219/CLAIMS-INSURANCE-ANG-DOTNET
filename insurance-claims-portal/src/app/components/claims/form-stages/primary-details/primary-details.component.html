<div class="primary-details-container">
  <h3 class="title">Primary Claim Details</h3>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <!-- Name -->
    <div class="form-group">
      <label for="name">Full Name</label>
      <input
        id="name"
        type="text"
        class="form-control"
        formControlName="name"
        placeholder="Enter your full name"
      />
      <div class="error" *ngIf="name?.touched && name?.invalid">
        Name is required.
      </div>
    </div>

    <!-- Policy Number -->
    <div class="form-group">
      <label for="policyNumber">Policy Number</label>
      <input
        id="policyNumber"
        type="text"
        class="form-control"
        formControlName="policyNumber"
        placeholder="Enter your policy number"
      />
      <div class="error" *ngIf="policyNumber?.touched && policyNumber?.invalid">
        Policy number is required.
      </div>
    </div>

    <!-- Date of Incident -->
    <div class="form-group">
      <label for="dateOfIncident">Date of Incident</label>
      <input
        id="dateOfIncident"
        type="date"
        class="form-control"
        formControlName="dateOfIncident"
      />
      <div class="error" *ngIf="dateOfIncident?.touched && dateOfIncident?.invalid">
        Date of incident is required.
      </div>
    </div>

    <!-- Submit -->
    <button type="submit" class="btn-submit" [disabled]="form.invalid">
      Next
    </button>
  </form>
</div>
